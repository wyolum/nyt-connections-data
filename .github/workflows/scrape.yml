name: Scrape NYT Connections

on:
  schedule:
    - cron: "1 8 * * *" # 03:01 EST (08:01 UTC) daily.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Fallback only: the Mac mini is primary. On a scheduled run, skip the
      # scrape if latest.json already points at today (ET). The dated file is
      # not proof: the lookahead creates it a day or more early, so only
      # latest.json marks a completed run for today. Manual dispatch always scrapes.
      - name: Check whether today's run already happened
        id: have
        run: |
          today="$(TZ=America/New_York date +%F)"
          latest="$(jq -r '.date // empty' docs/data/latest.json 2>/dev/null || true)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$latest" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::latest.json already at $today (Mac mini ran); skipping cloud scrape."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::latest.json at '${latest:-missing}', today $today (or manual run); scraping."
          fi

      - name: Setup Node
        if: steps.have.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install deps
        if: steps.have.outputs.skip != 'true'
        working-directory: scraper
        run: npm ci

      - name: Install Playwright browsers
        if: steps.have.outputs.skip != 'true'
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        if: steps.have.outputs.skip != 'true'
        run: node scraper/scrape.mjs

      - name: Upload failure screenshot
        if: failure() && steps.have.outputs.skip != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: failure-screenshot
          path: failure.png

      - name: Commit and push if changed
        if: steps.have.outputs.skip != 'true'
        run: |
          git config user.name "wyolum-bot"
          git config user.email "wyolum-bot@users.noreply.github.com"
          git add docs/data/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Connections data"
          git push
